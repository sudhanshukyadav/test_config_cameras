<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Config</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5e6875; --line: #dde1e6;
  --accent: #1f6feb; --accent-text: #ffffff; --ok: #1a7f37; --bad: #cf222e; --warn: #9a6700;
  --input: #ffffff; --code: #f0f2f5; --pad: #eef1f5; --pad-active: #cfe0fb;
  --agent: #1d5fd1; --agent-line: #9db9ec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #9aa4b2; --line: #2a3039;
    --accent: #4c8dff; --accent-text: #0b0d10; --ok: #3fb950; --bad: #f85149; --warn: #d29922;
    --input: #0f1216; --code: #0f1216; --pad: #222831; --pad-active: #23406e;
    --agent: #6ea3ff; --agent-line: #2f4f86;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
header .who { color: var(--muted); }
header .spacer { flex: 1; }
/* one screen: header, a line with the pages, the panels, and the status bar at the bottom */
html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
header, header { padding: 8px 12px; gap: 10px; }
header input { width: auto; }
.hgroup { display: inline-flex; align-items: center; gap: 6px; }
main { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; }
#form { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px; align-items: stretch; }
#form > p { grid-column: 1 / -1; }
#form .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
#form .col > fieldset { margin: 0 !important; }
#form .col > fieldset:last-child { flex: 1; }          /* every column ends on the same bottom line */
#form .field.wide { grid-column: 1 / -1; }
#form textarea.big { height: 58px; resize: vertical; }
#form[hidden] { display: none; }
#form .grid.osdgrid { grid-template-columns: 92px minmax(0, 1fr) minmax(0, 1fr); }
#form .osdgrid .field.tick label { white-space: nowrap; }
#form fieldset { padding: 4px 8px 8px !important; margin-bottom: 8px !important; }
#form .grid { grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 3px 8px; }
#form .field label { font-size: 11px; margin-bottom: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#form input, #form select, #form textarea { padding: 2px 6px; font-size: 13px; height: 26px; }
#form textarea { resize: vertical; }
#form .sechint { display: none; }
.ptzpoi .ppstatus { font-size: 12px; margin-bottom: 6px; }
.ptzpoi button { width: 100%; }
#form fieldset { break-inside: avoid; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 10px; padding: 6px 10px 10px; }
#form fieldset[hidden] { display: none; }
#form legend { font-weight: 600; font-size: 13px; padding: 0 4px; }
.sechint { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
fieldset.agent > .sechint { color: var(--agent); }
.field.agent label { color: var(--agent); }
.field.agent input, .field.agent select, .field.agent textarea { border-color: var(--agent-line); }
input.locked { opacity: .65; }
#statusbar { display: flex; align-items: center; gap: 10px; padding: 4px 12px; min-height: 28px; border-top: 1px solid var(--line);
  background: var(--panel); font-size: 12px; overflow-x: auto; white-space: nowrap; }
#statusbar button { padding: 0 8px; font-size: 11px; height: 22px; }
#sbMsg { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#sbMsg.bad, #sbAlarms { color: #fff; background: var(--bad); border-radius: 4px; padding: 1px 8px; border-color: var(--bad); }
#sbMsg .t { color: var(--muted); margin-right: 6px; }
#sbMsg.bad .t { color: #fde; }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
.hgroup[hidden] { display: none; }
fieldset.loginpanel.ask { border-color: #e5534b !important; box-shadow: 0 0 0 2px rgba(229,83,75,.25); }
.idrow button { width: 100%; }
button, select, input, textarea { font: inherit; color: var(--text); }
button { background: var(--pad); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.sel { outline: 2px solid var(--accent); }
button.camflip.on { background: #1f6feb; color: #fff; border-color: #1f6feb; }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { background: var(--input); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; width: 100%; min-width: 0; }
input[type=checkbox] { width: auto; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.field.agent label { color: var(--agent); }
.viewpage { display: block; }
.viewpage[hidden] { display: none; }
.viewpage .vbody { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.viewpage .vleft { flex: 1 1 560px; min-width: 0; max-width: calc((100vh - 230px) * 16 / 9); }
.viewpage .vright { flex: 0 1 380px; display: block; }
.viewpage .ptzbox, .viewpage .markers { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.viewpage .markers { margin-top: 10px; border-left: 1px solid var(--line); padding-left: 10px; }
.viewpage .snap { background: #000; }
.osdrow label { font-size: 12px; }
.floatwin { position: fixed; right: 12px; top: 100px; width: min(560px, calc(100vw - 24px)); min-width: 300px;
  max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow: auto; resize: both; z-index: 45;
  box-shadow: 0 16px 48px rgba(0, 0, 0, .35); margin: 0 !important; }
.floatwin[hidden] { display: none; }
.floatwin .vhead { display: flex; align-items: center; gap: 8px; margin: -12px -12px 10px; padding: 8px 12px;
  border-bottom: 1px solid var(--line); cursor: move; user-select: none; touch-action: none; }
.floatwin .vhead h2 { margin: 0; }
.floatwin .vhead .muted { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.floatwin .vhead button { padding: 2px 9px; font-size: 16px; line-height: 1; }
#resText { white-space: pre-wrap; font: 12px/1.45 ui-monospace, Consolas, monospace; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.field .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
.field.unused label { opacity: .7; }
.field.unused .hint { font-style: italic; }
.issues { margin: 0; padding-left: 18px; }
.issues li { color: var(--bad); }
.okline { color: var(--ok); }
pre.log { background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 8px;
  max-height: 160px; overflow: auto; font: 12px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; margin: 8px 0 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > input[type=number] { width: 80px; }
.pad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 38px); gap: 5px; justify-content: center; margin: 6px 0; }
.pad button { font-size: 18px; padding: 0; touch-action: none; user-select: none; }
.pad button.active { background: var(--pad-active); }
.snap { width: 100%; aspect-ratio: 16 / 9; background: var(--code); border: 1px solid var(--line); border-radius: 6px;
  display: flex; align-items: center; justify-content: center; color: var(--muted); overflow: hidden; }
.snap { position: relative; user-select: none; -webkit-user-select: none; }
.snap img { pointer-events: none; -webkit-user-drag: none; }
.snap img { width: 100%; height: 100%; object-fit: fill; display: block; }
/* flip_stream: the picture is shown as the CAMERA sends it; only the edge (multy.py) flips it */
.field .flipnote { display: inline-block; margin-left: 8px; background: #c62828; color: #fff; font: 600 11px/1.2 system-ui, sans-serif;
  padding: 2px 6px; border-radius: 4px; vertical-align: middle; }
.snap.flip::after { content: "flip_stream (page 1) is ON \2014  software flips the recordings; this view is the camera's"; position: absolute;
  top: 6px; left: 50%; transform: translateX(-50%); background: #c62828; color: #fff; font: 600 12px/1.2 system-ui, sans-serif;
  padding: 4px 10px; border-radius: 4px; pointer-events: none; z-index: 2; white-space: nowrap; }
.snap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.snap.drawing canvas { cursor: crosshair; }
/* camera view: a floating window, dragged by its title bar, resized at its lower right corner */
.viewwin { position: fixed; right: 12px; top: 60px; width: min(600px, calc(100vw - 24px)); min-width: 320px;
  max-width: calc(100vw - 16px); max-height: calc(100vh - 16px); overflow: auto; resize: both; z-index: 40;
  box-shadow: 0 16px 48px rgba(0, 0, 0, .35); margin: 0 !important; }
.viewwin[hidden] { display: none; }
.viewpage .vhead { display: flex; align-items: center; gap: 8px; margin: -12px -12px 10px; padding: 8px 12px;
  border-bottom: 1px solid var(--line); cursor: move; user-select: none; touch-action: none; }
.viewpage .vhead h2 { margin: 0; }
.viewpage .vhead .muted { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.viewpage .vhead button { padding: 2px 9px; font-size: 16px; line-height: 1; }
.viewpage h3 { font-size: 13px; margin: 0 0 6px; }
.viewpage .row button, .viewpage .zf button { padding: 4px 8px; font-size: 12px; }
.viewpage .row select { padding: 3px 6px; font-size: 12px; }
.ptzgrid { display: flex; gap: 10px; align-items: center; }
.zf { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; flex: 1; }
.viewpage .vright { display: flex; flex-wrap: wrap; gap: 10px; }
.viewpage .ptzbox { flex: 0 1 280px; }
.viewpage .markers { flex: 1 1 200px; margin-top: 0; padding-top: 0; border-top: 0; }
.zf { grid-template-columns: repeat(2, 60px); flex: none; }
.viewpage .ptzbox { flex: 0 1 270px; }
.viewpage .markers { border-left: 1px solid var(--line); padding-left: 10px; }
.viewpage .markers .row { flex-wrap: nowrap; }

.vbody { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.vleft { flex: 1 1 440px; min-width: 0; }
.vright { flex: 1 1 100%; min-width: 0; }
.viewpage .ptzbox { margin: 0; }
.viewpage .markers { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
#markerList { max-height: 120px; overflow: auto; }
.viewpage .markers h3 .muted { font-weight: 400; font-size: 12px; }
.mk { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
.mk .no { font-family: ui-monospace, Consolas, monospace; width: 28px; color: var(--muted); }
.mk .nm { flex: 1; min-width: 50px; padding: 3px 6px; font-size: 12px; }
.mk button { padding: 3px 9px; font-size: 12px; }
.osdline { font-size: 12px; color: var(--muted); margin-top: 4px; }
.osdline b { color: var(--text); font-weight: 600; }
.legend { font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend b.z { color: #e5534b; } .legend b.r { color: #4c8dff; } .legend b.o { color: #d4a72c; }
.status { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); }
.muted { color: var(--muted); }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
#toast.show { opacity: 1; }
/* view page (last, so it wins over the older window rules) */
.viewpage .osdbox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
.viewpage .osdbox label { font-size: 12px; }
.viewpage .pad { grid-template-columns: repeat(3, 36px); grid-template-rows: repeat(3, 30px); gap: 4px; }
.viewpage .pad button { font-size: 14px; }
.viewpage .zf { grid-template-columns: repeat(2, auto); }
.viewpage .osdbox .row.obtn { flex-wrap: wrap; gap: 4px; }
.viewpage .osdbox .row.obtn button { padding: 4px 6px; font-size: 12px; white-space: nowrap; }
.viewpage .snaprow { flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.ptzvals { display: flex; align-items: center; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.ptzvals b { color: var(--text); font-family: ui-monospace, Consolas, monospace; font-weight: 600; }
.ptzvals button { padding: 1px 8px; margin-left: auto; }
.viewpage .vleft { flex: 0 1 640px; min-width: 0; }
.viewpage .vright { flex: 0 1 380px; display: block; min-width: 300px; }
.viewpage .ptzbox { flex: none; }
.viewpage .markers { margin-top: 10px; border: 1px solid var(--line); padding: 10px; }
</style>
</head>
<body>
<header>
  <a id="backLive" href="/live.html" class="hbtn" title="Back" style="text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:inherit">&#9664; Back</a>
  <h1>Camera config and testing</h1>
  <select id="camPick" title="Open a saved camera (by camera ID)" style="width:auto;max-width:220px"></select>
  <span class="spacer"></span>
  <span class="who" id="who">no camera loaded</span>
  <button id="btnTest">Run test</button>
  <button id="btnSave" class="primary" title="Save the camera JSON on central and on the edge, and write the OSD and the settings into the camera">Save to camera and edge</button>
</header>
<main><form id="form" onsubmit="return false"><p class="muted">Loading…</p></form>
<section class="viewpage" id="viewWin" aria-label="View, PTZ and points of interest" hidden>
  <span id="viewWho" hidden></span>
  <div class="vbody">
  <div class="vleft">
  <div class="snap" id="snap">no picture</div>
  <div class="row snaprow">
    <select id="snapWhich" style="width:auto"><option value="sub">sub stream</option><option value="main">main stream</option></select>
    <button id="btnSnap">Refresh</button>
    <label class="row muted" style="gap:4px" title="Ticked: a fresh picture every 5 s and one after each move. Unticked: only after a move or Refresh"><input type="checkbox" id="liveSnap" checked> live</label>
    <button id="btnFlipV" class="camflip" title="Flip vertical (top-bottom): written directly into the CAMERA, at once (no Save). Blue = on. Not related to flip_stream on page 1.">Flip V</button><button id="btnFlipH" class="camflip" title="Flip horizontal (left-right): written directly into the CAMERA, at once (no Save). Blue = on. Not related to flip_stream on page 1.">Flip H</button>
    <button id="btnDrawZone" title="Drag on the picture: an area motion detection ignores (exclude_zones; several allowed)">Exclude zone</button>
    <button id="btnDrawRoi" title="Drag on the picture: the only area motion detection watches (roi_crop, turns on use_roi)">ROI</button>
    <button id="btnClearZones" title="Remove all exclude zones">Clear zones</button>
    <button id="btnClearRoi" title="Switch the ROI off (use_roi off)">Clear ROI</button>
  </div>
  </div>
  <div class="vright">
  <div class="osdbox" id="osdBox">
    <h3>OSD</h3>
    <label class="row" title="Keep the positions the camera has; placing the date or title yourself unticks it. Recommended: date top left, title top middle"><input type="checkbox" id="vOwnPos" checked> use the camera's default positions</label>
    <label class="row" title="Our own date and title in white (not the camera's OSD); Place date / Place title move it while ticked"><input type="checkbox" id="ownText"> own OSD text</label>
    <span class="row" style="gap:10px;margin-left:22px"><label class="row" style="gap:4px" title="our date (own OSD text)"><input type="checkbox" id="ownDate"> date</label><label class="row" style="gap:4px" title="our title (own OSD text)"><input type="checkbox" id="ownTitle"> title</label></span>
    <div class="row obtn" style="margin-top:6px">
      <button id="btnPlaceDate" title="Then click on the picture where the date should start (its top-left corner): our text while own OSD text is ticked, else the camera's (sent by Apply OSD)">Place date</button>
      <button id="btnPlaceName" title="Then click on the picture where the title should be (its top middle): our text while own OSD text is ticked, else the camera's (sent by Apply OSD)">Place title</button>
      <button id="btnReadOsd" title="Read the camera's title, date format and positions">Read OSD</button>
      <button id="btnApplyOsd" class="primary" title="Send title (camera ID), date format, on/off and your positions to the camera">Apply OSD</button>
      <button id="btnOsdOff" title="Switch the camera's OSD off: date, title and its other default texts (where the camera allows it)">OSD off</button>
      <button id="btnOsdOn" title="Switch the camera's date and title back on (title = camera ID), at the camera's default positions">OSD on</button>
    </div>
  </div>
  <div class="ptzbox" id="ptzCard">
    <h3>PTZ</h3>
  <div id="ptzOff" class="muted" hidden>This camera has ptz_protocol "none". Change it on the Camera page to use PTZ.</div>
    <div id="ptzOn">
      <div class="ptzgrid">
        <div class="pad">
          <span></span><button data-move="up" title="Tilt up (↑)">▲</button><span></span>
          <button data-move="left" title="Pan left (←)">◀</button>
          <button id="btnStop" title="Stop (space)">■</button>
          <button data-move="right" title="Pan right (→)">▶</button>
          <span></span><button data-move="down" title="Tilt down (↓)">▼</button><span></span>
        </div>
        <div class="zf">
          <button data-move="zoom_in" title="Zoom in (+)">Zoom +</button>
          <button data-move="zoom_out" title="Zoom out (-)">Zoom −</button>
          <button data-move="focus_near">Focus near</button>
          <button data-move="focus_far">Focus far</button>
          <button id="btnAF">Autofocus</button>
          <button id="btnLens">Lens init</button>
        </div>
      </div>
      <div class="row" style="margin-top:6px">
        <span class="muted">Speed</span>
        <input type="range" id="speed" min="0.1" max="1" step="0.1" value="0.5" style="flex:1">
        <span id="speedVal" class="status">0.5</span>
      </div>
      <div class="ptzvals" title="The camera's position, read after every move">
        <span>Pan <b id="pvPan">–</b></span><span>Tilt <b id="pvTilt">–</b></span>
        <span>Zoom <b id="pvZoom">–</b></span><span>Focus <b id="pvFocus">–</b></span>
        <button id="btnPos" title="Read the position now">&#8635;</button>
      </div>
      <div class="row" style="margin-top:6px" title="Send the camera to a position you type (ONVIF): pan and tilt from -1 to 1, zoom from 0 to 1. Empty zoom = keep the zoom.">
        <span class="muted">Go to</span>
        <label class="muted">P <input id="absX" type="number" min="-1" max="1" step="0.05" value="0" style="width:62px"></label>
        <label class="muted">T <input id="absY" type="number" min="-1" max="1" step="0.05" value="0" style="width:62px"></label>
        <label class="muted">Z <input id="absZ" type="number" min="0" max="1" step="0.05" placeholder="keep" style="width:62px"></label>
        <button id="btnAbsGo">Go</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="btnAbsTest" title="For cameras that report no position or store no presets: does the camera go to an absolute position (pan -0.5, +0.5, -0.5 again) and come back to the same view? About 25 s; the camera moves.">Absolute move test</button>
        <span class="muted" id="absVerdict"></span>
      </div>
      <div id="absPics" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px"></div>
    </div>
    </div>
  <div class="markers" id="markersBox">
      <h3 title="Points of interest: numbered 01, 02 … automatically; you only give the name. Saved in camera.ptz_markers and as presets (the location names central shows).">Points of interest</h3>
      <div id="markerList"></div>
      <div class="row" style="margin-top:6px">
        <span class="no" id="mkNo" title="next point number (automatic)">01</span>
        <input id="mkName" placeholder="name of this point" style="flex:1;min-width:60px">
        <button id="btnMkAdd" class="primary" title="Store the camera's current position as this preset and give it this name">Add</button>
      </div>
  </div>
  </div>
  </div>
</section>
</main>
<div id="statusbar">
  <button id="sbPrev" title="Older message">&#9664;</button><button id="sbNext" title="Newer message">&#9654;</button>
  <span id="sbPos" class="muted"></span>
  <span id="sbMsg"></span>
  <span class="spacer" style="flex:1"></span>
  <button id="sbAlarms" title="Show the alarms only / all messages" hidden></button>
  <button id="sbClear" title="Clear the alarms you have read" hidden>clear alarms</button>
</div>
<section class="card floatwin" id="resWin" aria-label="Test result" hidden>
  <div class="vhead" id="resHead" title="Drag to move">
    <h2>Test result</h2><span class="muted" id="resWho"></span>
    <button id="btnResClose" title="Close">&times;</button>
  </div>
  <pre id="resText"></pre>
  <pre class="log" id="log" hidden></pre>
</section>
<div id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const CHOICES = {
  vendor: ["dahua", "generic"], ptz_protocol: ["dahua_cgi", "onvif_soap", "none"],
  rtsp_transport: ["tcp", "udp"], codec: ["H.264", "H.265"], bitrate_type: ["CBR", "VBR"],
  day_night_mode: ["auto", "day", "night"], white_balance_mode: ["auto", "manual", "indoor", "outdoor"],
};
let current = null;   // {where, file, json, report}
let TEMPLATE = null;  // default JSON from the server; missing keys are filled from it
// Always offered, also when the server's template is older or did not answer: an old camera file still gets
// every field (filled with these defaults) so it can be set and saved.
const FIELD_DEFAULTS = {

function withDefaults(json) {
  const out = JSON.parse(JSON.stringify(json));
  const c0 = out.camera;                       // invert_stream = the old name of flip_stream
  if (c0 && "invert_stream" in c0) { if (!("flip_stream" in c0)) c0.flip_stream = !!c0.invert_stream; delete c0.invert_stream; }
  for (const src of [TEMPLATE || {}, FIELD_DEFAULTS]) {
    for (const [sec, obj] of Object.entries(src)) {
      if (!(sec in out) || out[sec] === null) { out[sec] = JSON.parse(JSON.stringify(obj)); continue; }
      if (obj && typeof obj === "object" && !Array.isArray(obj) && typeof out[sec] === "object")
        for (const [k, v] of Object.entries(obj)) if (!(k in out[sec])) out[sec][k] = JSON.parse(JSON.stringify(v));
    }
  }
  return out;
}

// ---- floating windows (view, test result): dragged by the title bar, resized at the corner
function makeFloating(win, head, key) {
  const store = (v) => { try { localStorage.setItem(key, v); } catch (e) {} };
  const keepInside = () => {
    const r = win.getBoundingClientRect(); if (!win.style.left) return;
    win.style.left = Math.max(0, Math.min(r.left, innerWidth - r.width)) + "px";
    win.style.top = Math.max(0, Math.min(r.top, innerHeight - 40)) + "px";
  };
  try { const p = JSON.parse(localStorage.getItem(key) || "null");
    if (p) { Object.assign(win.style, { left: p.l + "px", top: p.t + "px", right: "auto" }); if (p.w) win.style.width = p.w + "px"; }
  } catch (e) {}
  let start = null;
  head.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button")) return;
    const r = win.getBoundingClientRect(); start = { x: e.clientX - r.left, y: e.clientY - r.top }; head.setPointerCapture(e.pointerId);
  });
  head.addEventListener("pointermove", (e) => { if (!start) return;
    Object.assign(win.style, { right: "auto", left: Math.max(0, Math.min(e.clientX - start.x, innerWidth - win.offsetWidth)) + "px",
      top: Math.max(0, Math.min(e.clientY - start.y, innerHeight - 40)) + "px" }); });
  const save = () => { const r = win.getBoundingClientRect(); store(JSON.stringify({ l: Math.round(r.left), t: Math.round(r.top), w: Math.round(r.width) })); };
  head.addEventListener("pointerup", () => { if (start) { start = null; save(); } });
  head.addEventListener("pointercancel", () => { start = null; });
  new ResizeObserver(() => { if (!win.hidden && win.style.left) save(); }).observe(win);
  addEventListener("resize", keepInside);
  return keepInside;
}

async function api(path, body) {
  const r = await fetch(BASE + path, body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if ((r.headers.get("Content-Type") || "").startsWith("image/")) {
    if (!r.ok) throw new Error("picture failed"); return r.blob();
  }
  const d = await r.json(); if (!r.ok) throw new Error(d.error || r.status); return d;
}

function buildOsd(grid, obj) {
  grid.classList.add("osdgrid");
  const used = new Set();
  for (const r of OSD_ROWS) {

    for (let i = 0; i < 3; i++) {

      else if (k && k in obj) { const f = fieldFor("osd", k, obj[k]); if (i === 0) f.classList.add("tick"); grid.appendChild(f); used.add(k); }
      else grid.appendChild(document.createElement("div"));

  }
  for (const [k, v] of Object.entries(obj)) if (!used.has(k)) grid.appendChild(fieldFor("osd", k, v));

function flipRect(r) { return [r3(1 - r[2]), r3(1 - r[3]), r3(1 - r[0]), r3(1 - r[1])]; }
// page 1 flip_stream (the EDGE flips): zones / ROI follow, the camera's OSD goes off, our own text on
function flipStreamChanged() {
  // zones / ROI stay on the same spot of the scene: their coordinates follow the turn
  const z = zonesNow().filter(r => Array.isArray(r) && r.length === 4).map(flipRect);
  if (fld("exclude_zones")) fld("exclude_zones").value = JSON.stringify(z);
  if (roiNow() && fld("roi_crop")) fld("roi_crop").value = flipRect(roiNow()).join(", ");
  showFlip();
  sbStep(isFlip() ? "flip_stream ON: multy.py (software) flips the recordings (Save to camera and edge to use it)" : "flip_stream off (Save to camera and edge to use it)");
}

function camFlipShow(axis, d) {
  const b = $(axis === "h" ? "btnFlipH" : "btnFlipV"); if (!b) return;
  b.dataset.state = !d ? "?" : d.flip === true ? "on" : d.flip === false ? "off" : "?";
  b.classList.toggle("on", !!(d && d.flip));            // blue = on in the camera

async function camFlip(action, axis) {
  if (!current) return toast("Load a camera first");
  let json; try { json = readForm(); } catch (e) { return toast(e.message); }
  const b = $(axis === "h" ? "btnFlipH" : "btnFlipV"), name = axis === "h" ? "Flip horizontal" : "Flip vertical";
  b.disabled = true;
  try {
    const d = await api("/api/camflip", { json, action, axis });
    // a camera that does not report its state (flip = null): the last press that changed the picture counts
    const memo = `camflip:${axis}:${json.camera?.host || ""}`;
    if (d.flip === null && (d.supported || action !== "read")) {
      if (action !== "read" && d.ok) localStorage.setItem(memo, action);
      const last = localStorage.getItem(memo);
      if (last) d.flip = last === "on";
    }
    camFlipShow(axis, d);
    const last = (d.log || []).slice(-1)[0] || "";
    if (action === "read") { /* quiet: a camera without this setting just leaves the button plain */ }
    else if (d.ok) { (d.as_asked === false && d.picture ? sbIssue : sbStep)(`${name} ${action}: ${last.replace("picture check: ", "")}`); refreshSnap(); }
    else { sbIssue(`${name}: ${last}`); refreshSnap(); }
  } catch (e) { sbIssue(`${name}: ${e.message}`); }
  b.disabled = false;

function fieldFor(sec, key, v) {
  const wrap = document.createElement("div"); wrap.className = "field";
  const id = `f_${sec}_${key}`;
  const hint = HINTS[`${sec}.${key}`] || "";
  const agent = hint.startsWith("*");
  const text = hint.replace(/^\*\s?/, "");
  wrap.innerHTML = `<label for="${esc(id)}"${text ? ` title="${esc(text)}"` : ""}>${esc(key || sec)}</label>`;
  if (agent) wrap.classList.add("agent");
  if (WIDE.has(`${sec}.${key}`)) wrap.classList.add("wide");
  let el;
  if (typeof v === "boolean") {
    el = document.createElement("input"); el.type = "checkbox"; el.checked = v; el.dataset.type = "bool";
  } else if (typeof v === "number") {
    el = document.createElement("input"); el.type = "number"; el.step = "any"; el.value = v; el.dataset.type = "num";
  } else if (sec === "camera" && key === "site") {          // a site of pull.json only
    el = document.createElement("select"); el.dataset.type = "str";
    const known = SITES.find(x => x.toUpperCase() === String(v).toUpperCase());
    el.innerHTML = `<option value=""${known || !v ? "" : ""}>choose a site…</option>` +
      SITES.map(x => `<option${x === known ? " selected" : ""}>${esc(x)}</option>`).join("") +
      (v && !known ? `<option selected value="${esc(v)}">${esc(v)} (not in pull.json)</option>` : "");
  } else if (typeof v === "string" && CHOICES[key]) {
    el = document.createElement("select"); el.dataset.type = "str";
    const opts = CHOICES[key].includes(v) ? CHOICES[key] : [v, ...CHOICES[key]];
    el.innerHTML = opts.map(o => `<option${o === v ? " selected" : ""}>${esc(o)}</option>`).join("");
  } else if (typeof v === "string") {
    el = document.createElement("input"); el.type = key === "password" ? "password" : "text"; el.value = v; el.dataset.type = "str";
    if (key === "password") el.autocomplete = "off";
  } else if (Array.isArray(v) && key !== "exclude_zones" && v.every(x => typeof x === "number")) {
    el = document.createElement("input"); el.type = "text"; el.value = v.join(", "); el.dataset.type = "numlist";
  } else {
    el = document.createElement("textarea"); el.rows = 1; el.value = JSON.stringify(v); el.dataset.type = "json";
    if (key === "ptz_markers") { el.rows = 3; el.classList.add("big"); }
  }
  el.id = id; el.dataset.section = sec; el.dataset.key = key;
  if (text) el.title = text;
  wrap.appendChild(el);
  if (sec === "camera" && key === "flip_stream") {           // page 1: the same warning as on the view
    const n = document.createElement("span"); n.className = "flipnote";
    n.textContent = "Tick only if the stream is inverted on PTZ page meaning flip on PTZ page is non functional.";
    wrap.appendChild(n);
  }
  if (sec === "motion" && (key === "exclude_zones" || key === "roi_crop" || key === "use_roi"))
    el.addEventListener("change", drawOverlay);
  if (sec === "osd") el.addEventListener("change", drawOverlay);
  return wrap;
}

function readForm() {
  const out = JSON.parse(JSON.stringify(current.json));
  for (const el of $("form").querySelectorAll("[data-section]:not(fieldset)")) {
    const { section, key, type } = el.dataset;
    let v;
    if (type === "bool") v = el.checked;
    else if (type === "num") { v = el.value === "" ? null : Number(el.value); if (Number.isNaN(v)) throw new Error(`${section}.${key} is not a number`); }
    else if (type === "numlist") v = el.value.split(",").map(s => s.trim()).filter(Boolean).map(Number);
    else if (type === "json") { try { v = JSON.parse(el.value); } catch { throw new Error(`${section}.${key} is not valid JSON`); } }
    else v = el.value;
    if (key === "") out[section] = v; else out[section][key] = v;
  }
  // PTZ markers are the camera's points of interest: the central server reads their names from "presets"
  const mk = out.camera && out.camera.ptz_markers;
  if (mk && typeof mk === "object" && Object.keys(mk).length)
    out.presets = Object.fromEntries(Object.entries(mk).map(([k, v]) => [k, poiName(v)]));
  return out;
}

// ---- bottom bar: every message is kept (newest shown); ◀ ▶ step through them; alarms (red) until cleared
const SB = { list: [], at: -1, alarmsOnly: false };
function sbAdd(text, bad) {
  const n = new Date(), t = [n.getHours(), n.getMinutes(), n.getSeconds()].map(v => String(v).padStart(2, "0")).join(":");
  SB.list.push({ text, bad, t });
  if (SB.list.length > 300) SB.list.shift();
  SB.at = -1;                                   // follow the newest
  sbShow();
}
function sbView() { return SB.alarmsOnly ? SB.list.filter(m => m.bad) : SB.list; }
function sbShow() {
  const v = sbView(), i = SB.at < 0 ? v.length - 1 : SB.at, m = v[i], box = $("sbMsg");
  box.className = m && m.bad ? "bad" : "";
  box.innerHTML = m ? `<span class="t">${m.t}</span>${esc(m.text)}` : "";
  box.title = m ? m.text : "";
  $("sbPos").textContent = v.length ? `${i + 1}/${v.length}` : "";
  const alarms = SB.list.filter(x => x.bad).length;
  $("sbAlarms").hidden = !alarms && !SB.alarmsOnly; $("sbAlarms").textContent = SB.alarmsOnly ? "all messages" : `${alarms} alarm${alarms === 1 ? "" : "s"}`;
  $("sbClear").hidden = !alarms;
}
function sbStep(text) { sbAdd(text, false); }
function sbIssue(text) { sbAdd(text, true); }
function sbClear() {}                           // messages are kept; a new test does not wipe them
$("sbPrev").onclick = () => { const v = sbView(); if (!v.length) return; SB.at = Math.max(0, (SB.at < 0 ? v.length - 1 : SB.at) - 1); sbShow(); };
$("sbNext").onclick = () => { const v = sbView(); if (SB.at < 0) return; SB.at = SB.at + 1 >= v.length ? -1 : SB.at + 1; sbShow(); };
$("sbAlarms").onclick = () => { SB.alarmsOnly = !SB.alarmsOnly; SB.at = -1; sbShow(); };
$("sbClear").onclick = () => { SB.list = SB.list.filter(m => !m.bad); SB.alarmsOnly = false; SB.at = -1; sbShow(); };
const BAD_LINE = /\b(FAIL|FAILED|ERROR|not reachable|test stop|locked)\b/;   // probes of single paths are not failures

// No events while a camera is open here (multy.py, cameras whose PTZ position cannot be read; decided 2026-11-11):
// the edge's <camera>_config.lock is kept fresh every 20 s and removed when another camera is opened or the
// page is closed (a lock not refreshed for 60 s is over anyway).
const LOCK = { key: null, cam: null };
function lockCall(cam, action) {
  if (!cam) return;
  fetch(BASE + "/api/config_lock", { method: "POST", headers: { "Content-Type": "application/json" }, keepalive: true,
    body: JSON.stringify({ site: cam.site, name: cam.name, action }) }).catch(() => {});
}
function lockHold() {
  const c = current && current.json && current.json.camera;
  const key = c && c.site && c.name ? `${c.site}/${c.name}` : null;
  if (LOCK.key && LOCK.key !== key) lockCall(LOCK.cam, "release");
  LOCK.key = key; LOCK.cam = key ? { site: c.site, name: c.name } : null;
  if (LOCK.cam) lockCall(LOCK.cam, "hold");
}
setInterval(lockHold, 20000);

async function ptz(action, extra = {}) {
  if (!current) return;
  try {
    const d = await api("/api/ptz", { camera: camNow(), action, speed: Number($("speed").value), ...extra });
    const NAMES = { left: "pan left", right: "pan right", up: "tilt up", down: "tilt down", zoom_in: "zoom in", zoom_out: "zoom out",
      focus_near: "focus near", focus_far: "focus far", stop: "stop", goto: "go to preset", set_preset: "store preset",
      autofocus: "autofocus", lens_init: "lens init", status: "read position" };
    const what = NAMES[action] || action;
    if (d.status) { const p = d.status;
      const none = p.reported === false;
      if (none && !ptz.noPos) { ptz.noPos = true; sbIssue("PTZ: this camera does not report its position (pan / tilt / zoom unknown)"); }
      const f2 = (v) => (none ? "–" : typeof v === "number" ? v.toFixed(2) : (v ?? "–"));
      $("pvPan").textContent = f2(p.x); $("pvTilt").textContent = f2(p.y); $("pvZoom").textContent = f2(p.z); $("pvFocus").textContent = f2(p.focus);
      ptzPoiStatus.pos = `pan ${f2(p.x)} tilt ${f2(p.y)} zoom ${f2(p.z)}`; ptzPoiStatus();
      if (action !== "status") sbStep(`PTZ ${what}: OK`); }
    else if (!d.ok) sbIssue(`PTZ ${what}: the camera refused${d.error ? " (" + d.error + ")" : ""}`);
    else if (!["left", "right", "up", "down", "zoom_in", "zoom_out", "focus_near", "focus_far", "stop"].includes(action) || extra.preset)
      sbStep(`PTZ ${what}${extra.preset ? " " + String(extra.preset).padStart(2, "0") : ""}: OK`);
    return d;
  } catch (e) { sbIssue(`PTZ ${action}: ${e.message}`); }
}

// top-level "presets" that the central server reads for the location names)
const mkField = () => document.getElementById("f_camera_ptz_markers");
function markersNow() {
  try { const m = JSON.parse(mkField()?.value || "{}"); return m && typeof m === "object" && !Array.isArray(m) ? m : {}; }
  catch { return {}; }
}
// a point: {"name": "Door", "pan": 14, "tilt": 0, "zoom": 128} (older files: just the name)
const poiName = (v) => (v && typeof v === "object" ? v.name || "" : String(v ?? ""));
function poiAt(name, st, token) {
  const r = (v) => (typeof v === "number" ? Math.round(v * 1000) / 1000 : null);
  const p = st && st.reported !== false ? { name, pan: r(st.x), tilt: r(st.y), zoom: r(st.z) } : { name };
  if (token) p.token = String(token);               // the camera's own preset number, when it chose one
  return p;
}
const poiToken = (v) => (v && typeof v === "object" && v.token ? v.token : null);
async function positionNow() { const d = await ptz("status"); return d && d.status ? d.status : null; }
function setMarkers(m) {
  setTimeout(ptzPoiStatus, 0);
  const sorted = Object.fromEntries(Object.entries(m).sort(([a], [b]) => Number(a) - Number(b)));
  if (mkField()) mkField().value = JSON.stringify(sorted);
  renderMarkers();
}
function renderMarkers() {
  const m = markersNow(), box = $("markerList"); box.innerHTML = "";
  const keys = Object.keys(m).sort((a, b) => Number(a) - Number(b));
  if (!keys.length) box.innerHTML = '<div class="muted" style="font-size:12px">none yet: move the camera, type a name, Add</div>';
  for (const k of keys) {
    const row = document.createElement("div"); row.className = "mk";
    const pos = m[k] && typeof m[k] === "object" && m[k].pan != null ? `pan ${m[k].pan} tilt ${m[k].tilt} zoom ${m[k].zoom}` : "position not stored yet: Set";
    row.innerHTML = `<span class="no" title="${esc(pos)}">${esc(k)}</span><input class="nm" value="${esc(poiName(m[k]))}" title="${esc(pos)}">` +
      `<button data-a="go" title="Move the camera to this point">Go</button>` +
      `<button data-a="here" title="Store the camera's current position as this point">Set</button>` +
      `<button data-a="del" title="Not interested any more: off the list (the camera keeps its preset; the number is not reused)">&times;</button>`;
    row.querySelector(".nm").onchange = (e) => { const x = markersNow(), v = x[k];
      x[k] = v && typeof v === "object" ? { ...v, name: e.target.value.trim() } : { name: e.target.value.trim() }; setMarkers(x); };
    row.querySelector('[data-a="go"]').onclick = async () => { sbStep(`moving to ${k} ${poiName(m[k])}…`);
      const d = await ptz("goto", { preset: Number(k), token: poiToken(m[k]) }); if (d && d.ok) { ptz("status"); refreshSnap(); } };
    row.querySelector('[data-a="here"]').onclick = async () => {
      const d = await ptz("set_preset", { preset: Number(k), token: poiToken(m[k]) }); if (!d || !d.ok) return;
      const st = await positionNow(), x = markersNow(); x[k] = poiAt(poiName(x[k]), st, d.token && d.token !== String(Number(k)) ? d.token : null); setMarkers(x);
      sbStep(`${k} ${poiName(x[k])}: position stored${x[k].pan != null ? ` (pan ${x[k].pan} tilt ${x[k].tilt} zoom ${x[k].zoom})` : ""}${x[k].token ? ` (camera preset ${x[k].token})` : ""}`); };
    row.querySelector('[data-a="del"]').onclick = () => {        // off the list; its number is never given out again
      current.json.poi_last = poiLast(); const x = markersNow(); delete x[k]; setMarkers(x); sbStep(`point ${k} removed from the list (number ${k} stays retired)`); };
    box.appendChild(row);
  }
  $("mkNo").textContent = nextPoi(m);
}
// The next point gets the number after the highest ever used (kept as "poi_last"), never a freed one.
function poiLast() { return Math.max(Number((current && current.json.poi_last) || 0), ...Object.keys(markersNow()).map(Number), 0); }
function nextPoi() { return String(poiLast() + 1).padStart(2, "0"); }
$("mkName").addEventListener("keydown", e => { if (e.key === "Enter") $("btnMkAdd").click(); });
$("btnMkAdd").onclick = async () => {
  if (!current) return toast("Load a camera first");
  const name = $("mkName").value.trim(), m = markersNow(), k = nextPoi(m), n = Number(k);
  if (!name) { toast("Give the point a name"); return $("mkName").focus(); }
  if (n > 255) return toast("No preset numbers left (255)");
  const d = await ptz("set_preset", { preset: n });
  if (!d || !d.ok) return toast("The camera did not store the preset: see the bottom bar");
  const st = await positionNow();
  m[k] = poiAt(name, st, d.token && d.token !== String(n) ? d.token : null); current.json.poi_last = n; setMarkers(m); $("mkName").value = "";
  sbStep(`${k} ${name} stored${m[k].pan != null ? ` at pan ${m[k].pan} tilt ${m[k].tilt} zoom ${m[k].zoom}` : ""}${m[k].token ? ` (camera preset ${m[k].token})` : ""}; Save to camera and edge keeps it`);
};

// ---- picture
async function refreshSnap() {
  if (!current || refreshSnap.busy) return;   // one picture request at a time
  refreshSnap.busy = true;
  try { await loadSnap(); } finally { refreshSnap.busy = false; }
}
async function loadSnap() {
  const box = $("snap"); if (!box.querySelector("img")) box.textContent = "loading…";
  try {
    let encoder = {}; try { encoder = readForm().stream_encoder_properties || {}; } catch {}
    const blob = await api("/api/snapshot", { camera: camNow(), which: $("snapWhich").value, encoder });
    const url = URL.createObjectURL(blob);
    const img = new Image(); img.alt = "camera picture";
    img.onload = () => {
      box.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
      box.innerHTML = ""; box.appendChild(img);
      const cv = document.createElement("canvas"); box.appendChild(cv); hookCanvas(cv); drawOverlay();
    };
    img.src = url;
  } catch (e) { box.textContent = "no picture: " + e.message; }
}

// ---- exclude zones / ROI drawn on the picture (fractions 0..1 of the frame, like multy.py)
let drawMode = null, dragStart = null, dragNow = null;
const fld = (k) => document.getElementById(`f_motion_${k}`);
function zonesNow() { try { const z = JSON.parse(fld("exclude_zones").value || "[]"); return Array.isArray(z) ? z : []; } catch { return []; } }
function roiNow() { const v = (fld("roi_crop")?.value || "").split(",").map(Number); return v.length === 4 && v.every(n => !isNaN(n)) ? v : null; }
function drawOverlay() {
  const cv = document.querySelector(".snap canvas"); if (!cv || !current) return;
  const w = cv.width = cv.clientWidth, h = cv.height = cv.clientHeight, g = cv.getContext("2d");
  g.clearRect(0, 0, w, h); g.lineWidth = 2;
  if (isFlip()) g.setTransform(-1, 0, 0, -1, w, h);   // stored for the turned picture: drawn turned on the camera's view
  const rect = (r, stroke, fill) => { const [x1, y1, x2, y2] = r;
    g.fillStyle = fill; g.strokeStyle = stroke;
    g.fillRect(x1 * w, y1 * h, (x2 - x1) * w, (y2 - y1) * h); g.strokeRect(x1 * w, y1 * h, (x2 - x1) * w, (y2 - y1) * h); };
  if (fld("use_roi")?.checked && roiNow()) rect(roiNow(), "#4c8dff", "rgba(76,141,255,.10)");
  zonesNow().forEach(z => Array.isArray(z) && z.length === 4 && rect(z, "#e5534b", "rgba(229,83,75,.28)"));
  if (dragStart && dragNow) rect(norm(dragStart, dragNow), drawMode === "roi" ? "#4c8dff" : "#e5534b", "rgba(255,255,255,.15)");
  // Own OSD text (optional, off by default): our date and title as plain white text, no boxes.
  // The camera's own OSD is in the picture itself; nothing else is drawn for it.
  const of = (k) => document.getElementById(`f_osd_${k}`);
  if (!of("own_overlay")?.checked) return;
  const pt = (k) => { const v = (of(k)?.value || "").split(",").map(Number); return v.length === 2 && v.every(n => !isNaN(n)) ? v : null; };
  const n = new Date(), p2 = (v) => String(v).padStart(2, "0");
  const dateText = (of("date_format")?.value || "dd-MM-yyyy HH:mm:ss")
    .replace(/yyyy|MM|dd|HH|mm|ss/g, t => ({ yyyy: n.getFullYear(), MM: p2(n.getMonth() + 1), dd: p2(n.getDate()),
                                           HH: p2(n.getHours()), mm: p2(n.getMinutes()), ss: p2(n.getSeconds()) }[t]));
  const size = Math.max(8, Math.round(h * Math.min(0.2, Math.max(0.01, Number(of("overlay_text_size")?.value) || 0.04))));
  g.font = `${size}px Arial, sans-serif`; g.textBaseline = "top"; g.fillStyle = "#ffffff";
  const text = (p, t, centre) => { const tw = g.measureText(t).width; g.fillText(t, centre ? p[0] * w - tw / 2 : p[0] * w, p[1] * h); };
  if (of("own_date")?.checked !== false && pt("overlay_date_position")) text(pt("overlay_date_position"), dateText, false);
  if (of("own_title")?.checked !== false && pt("overlay_name_position")) text(pt("overlay_name_position"), cameraId(), true);
}
const r3 = (n) => Math.round(Math.min(1, Math.max(0, n)) * 1000) / 1000;
function norm(a, b) { return [r3(Math.min(a[0], b[0])), r3(Math.min(a[1], b[1])), r3(Math.max(a[0], b[0])), r3(Math.max(a[1], b[1]))]; }
function hookCanvas(cv) {
  const pos = (e) => { const b = cv.getBoundingClientRect(), x = (e.clientX - b.left) / b.width, y = (e.clientY - b.top) / b.height;
    return isFlip() ? [1 - x, 1 - y] : [x, y]; };   // flip: coordinates of the flipped picture
  cv.addEventListener("pointerdown", (e) => {
    if (!drawMode) return; e.preventDefault();
    if (drawMode === "date" || drawMode === "name") {          // one click moves the date / title
      const what = drawMode === "date" ? "date" : "title", at = pos(e).map(r3).join(", ");
      if (document.getElementById("f_osd_own_overlay")?.checked) {   // our own text
        const f = document.getElementById(`f_osd_overlay_${drawMode}_position`); if (f) f.value = at;
        sbStep(`own OSD text: ${what} placed at ${at}`);
      } else if (isFlip()) {                            // the camera draws its OSD on the unturned picture
        sbIssue("camera OSD: untick flip to place the camera's date / title (the camera draws them on its own, unturned picture)");
      } else {                                                       // the camera's OSD: sent by Apply OSD
        const u = document.getElementById("f_osd_use_camera_positions"); if (u) u.checked = false; osdPositionsLock();
        const f = document.getElementById(`f_osd_${drawMode}_position`); if (f) f.value = at;
        sbStep(`camera OSD: ${what} placed at ${at}; Apply OSD sends it to the camera`);
      }
      setDrawMode(null); drawOverlay(); return;
    }
    cv.setPointerCapture(e.pointerId); dragStart = dragNow = pos(e); });
  cv.addEventListener("pointermove", (e) => { if (dragStart) { e.preventDefault(); dragNow = pos(e); drawOverlay(); } });
  const finish = (e) => {
    if (!dragStart) return; const r = norm(dragStart, e.type === "pointerup" ? pos(e) : dragNow); dragStart = dragNow = null;
    if (r[2] - r[0] > 0.01 && r[3] - r[1] > 0.01) {
      if (drawMode === "roi") { fld("roi_crop").value = r.join(", "); fld("use_roi").checked = true; }
      else { const z = zonesNow(); z.push(r); fld("exclude_zones").value = JSON.stringify(z); }
    }
    setDrawMode(null); drawOverlay();
  };
  for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) cv.addEventListener(ev, finish);
}
function setDrawMode(m) {
  drawMode = m; document.querySelector(".snap").classList.toggle("drawing", !!m);
  $("btnDrawZone").classList.toggle("sel", m === "zone"); $("btnDrawRoi").classList.toggle("sel", m === "roi");
  $("btnPlaceDate").classList.toggle("sel", m === "date"); $("btnPlaceName").classList.toggle("sel", m === "name");
  if (m === "date" || m === "name") sbStep("click on the picture where the " + (m === "date" ? "date should start" : "title should be (its middle)"));
}
$("btnPlaceDate").onclick = () => { if (!document.querySelector(".snap canvas")) return toast("Load a picture first"); setDrawMode(drawMode === "date" ? null : "date"); };
$("btnPlaceName").onclick = () => { if (!document.querySelector(".snap canvas")) return toast("Load a picture first"); setDrawMode(drawMode === "name" ? null : "name"); };
// ---- OSD: title = camera ID; the positions are the camera's while "use_camera_positions" is ticked
function osdFromCamera() {
  const c = OSD.cam || {};
  for (const k of ["date_position", "name_position"]) {
    const f = document.getElementById(`f_osd_${k}`);
    if (f && Array.isArray(c[k])) f.value = c[k].join(", ");
  }
}
function osdSummary() {
  const c = OSD.cam || {};
  if (OSD.read) sbStep(`OSD now: title "${c.title || "?"}", date ${c.date_format || "?"}; Apply sets title ${cameraId()}`);
}
async function osdCall(action) {
  if (!current) return toast("Load a camera first");
  let json; try { json = readForm(); } catch (e) { return toast(e.message); }
  const b = action === "apply" ? $("btnApplyOsd") : $("btnReadOsd"), old = b.textContent;
  b.disabled = true; b.textContent = action === "apply" ? "Applying…" : "Reading…";
  try {
    const d = await api("/api/osd", { json, action });
    if (d.osd) {
      OSD.cam = d.osd; OSD.read = true;
      if (document.getElementById("f_osd_use_camera_positions")?.checked !== false) osdFromCamera();
    }
    drawOverlay(); osdSummary();
    if (d.ok) sbStep(`OSD ${action === "apply" ? "set: title " + d.camera_id : "read"} via ${d.protocol}`);
    else (d.log || []).slice(-2).forEach(l => sbIssue("OSD: " + l));
    (d.log || []).filter(l => /instead/.test(l)).forEach(l => sbIssue("OSD: " + l));
    (d.log || []).filter(l => /^on\/off flags/.test(l)).forEach(l => sbStep("OSD " + l));
    if (action === "apply" && d.ok) setTimeout(refreshSnap, 1500);
  } catch (e) { sbIssue("OSD " + action + ": " + e.message); }
  b.disabled = false; b.textContent = old;
}
$("btnReadOsd").onclick = () => osdCall("read");
// view page: "own OSD text" with its two ticks (date, title), the same settings as in the OSD panel
function ownTicks() {
  const on = !!document.getElementById("f_osd_own_overlay")?.checked;
  for (const [k, id] of [["own_date", "ownDate"], ["own_title", "ownTitle"]]) {
    const f = document.getElementById(`f_osd_${k}`);
    $(id).checked = f ? f.checked : true; $(id).disabled = !on;
  }
}
for (const [k, id, what] of [["own_date", "ownDate", "date"], ["own_title", "ownTitle", "title"]])
  $(id).onchange = () => { const f = document.getElementById(`f_osd_${k}`); if (f) f.checked = $(id).checked;
    sbStep(`own OSD text: ${what} ${$(id).checked ? "on" : "off"}`); drawOverlay(); };
$("ownText").onchange = () => {
  const f = document.getElementById("f_osd_own_overlay"); if (f) f.checked = $("ownText").checked;
  sbStep(`own OSD text ${$("ownText").checked ? "on" : "off"}`); ownTicks(); drawOverlay();
};
$("vOwnPos").onchange = () => {
  const f = document.getElementById("f_osd_use_camera_positions"); if (!f) return;
  f.checked = $("vOwnPos").checked; osdPositionsLock(); if (f.checked && OSD.read) osdFromCamera(); drawOverlay();
};
$("btnOsdOff").onclick = () => {        // date, title and the camera's other texts off, sent at once
  for (const [k, v] of [["show_date", false], ["show_name", false], ["other_texts_off", true]]) {
    const f = document.getElementById(`f_osd_${k}`); if (f) f.checked = v;
  }
  drawOverlay(); osdCall("apply");
};
$("btnOsdOn").onclick = () => {         // date and title back on, sent at once
  for (const [k, v] of [["show_date", true], ["show_name", true], ["other_texts_off", false]]) {
    const f = document.getElementById(`f_osd_${k}`); if (f) f.checked = v;
  }
  drawOverlay(); osdCall("apply");
};
$("btnApplyOsd").onclick = () => osdCall("apply");

$("btnDrawZone").onclick = () => { if (!document.querySelector(".snap canvas")) return toast("Load a picture first"); setDrawMode(drawMode === "zone" ? null : "zone"); };
$("btnDrawRoi").onclick = () => { if (!document.querySelector(".snap canvas")) return toast("Load a picture first"); setDrawMode(drawMode === "roi" ? null : "roi"); };
$("btnClearZones").onclick = () => { if (!current) return; fld("exclude_zones").value = "[]"; drawOverlay(); sbStep("exclude zones cleared"); };
$("btnClearRoi").onclick = () => { if (!current) return; fld("use_roi").checked = false; drawOverlay(); sbStep("ROI off (use_roi off)"); };
window.addEventListener("resize", drawOverlay);
$("btnSnap").onclick = refreshSnap;
$("snapWhich").onchange = refreshSnap;

api("/api/template").then(d => {
  TEMPLATE = d.json; SITES = d.sites || [];
  const L = d.stream_limit;                    // the plant's limit for the main stream (pull.json settings.stream_limit)
  SECTION_HINTS.stream_encoder_properties = L
    ? `Plant stream limit: main stream at most ${L.max_width}x${L.max_height}, ${L.max_fps} fps, ${L.max_kbps} kbps. ` +
      `Save to camera and edge caps higher values and writes them into the camera; the edge reports a camera that sends more.`
    : "No stream limit (pull.json settings.stream_limit is off).";
}).catch(() => {})
  .finally(() => { loadList().catch(e => toast(e.message)); if (!current) newCamera(); });   // ready to type an IP
</script>
</body>
</html>
